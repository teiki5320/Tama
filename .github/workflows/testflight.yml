# Envoi TestFlight sans Mac : compile, signe (signature cloud automatique
# via la clé API App Store Connect) et téléverse le build.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   ASC_KEY_ID       identifiant de la clé API App Store Connect
#   ASC_ISSUER_ID    issuer ID de l'équipe (page des clés API)
#   ASC_KEY_CONTENT  contenu du fichier .p8 (brut ou base64)
#
# Déclenchement : onglet Actions → TestFlight → Run workflow.
# L'option « essai à blanc » compile sans signer ni téléverser : elle ne
# demande aucun secret et sert à valider la chaîne de compilation.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Essai à blanc (compile seulement, sans secrets)"
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  deploy:
    name: Build et envoi TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Environnement (traçabilité en cas d'échec)
        run: |
          echo "macOS : $(sw_vers -productVersion)"
          echo "Xcode : $(xcodebuild -version | head -1)"

      - name: Installation de Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      # Étape la plus longue et la plus fragile : placée avant tout ce qui
      # touche aux secrets, pour qu'un essai à blanc la valide vraiment.
      - name: Compilation Flutter (sans signature)
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }}

      - name: Installation de la clé API App Store Connect
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_KEY_CONTENT" ]; then
            echo "::error::Secrets manquants — ajouter ASC_KEY_ID, ASC_ISSUER_ID et ASC_KEY_CONTENT dans Settings → Secrets and variables → Actions."
            exit 1
          fi
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          # Le secret accepte les deux formes : le contenu brut du .p8
          # (copier-coller direct, seule option praticable depuis un iPad)
          # ou sa version encodée en base64.
          if printf '%s' "$ASC_KEY_CONTENT" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_CONTENT" > "$KEY_PATH"
          else
            printf '%s' "$ASC_KEY_CONTENT" | base64 --decode > "$KEY_PATH"
          fi
          # Sans cette vérification, une clé mal copiée ne casserait que
          # bien plus loin, avec un message d'erreur incompréhensible.
          openssl pkey -in "$KEY_PATH" -noout 2>/dev/null || {
            echo "::error::Clé .p8 illisible — revérifier le secret ASC_KEY_CONTENT"
            exit 1
          }

      - name: Archive signée (signature cloud automatique)
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM=K597U7X3FZ \
            CODE_SIGN_STYLE=Automatic

      - name: Export de l'IPA
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Envoi vers TestFlight
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios \
            -f build/ios/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: IPA en artefact (dépannage)
        if: ${{ !inputs.dry_run && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tama-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore

      # Contrôles des étapes qui suivent la compilation, sans avoir besoin
      # des secrets : un défaut ici ferait échouer le vrai envoi à la
      # toute dernière minute, après un quart d'heure de build.
      - name: Vérifications à blanc
        if: ${{ inputs.dry_run }}
        run: |
          echo "— Schéma Xcode —"
          xcodebuild -workspace ios/Runner.xcworkspace -list | head -20
          echo "— Options d'export —"
          plutil -lint ios/ExportOptions.plist
          echo "— Outil d'envoi App Store —"
          xcrun --find altool
          echo "— Icône marketing (Apple refuse tout canal alpha) —"
          sips -g hasAlpha -g pixelWidth \
            ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
          echo
          echo "Essai à blanc terminé : compilation, schéma, options d'export,"
          echo "outil d'envoi et icône validés."
          echo "Relancer sans l'option, avec les secrets, pour envoyer sur TestFlight."
