name: tama
description: "Tama — micro-dramas verticaux africains francophones."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2
  supabase_flutter: ^2.8.0
  video_player: ^2.9.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.1.0
  cached_network_image: ^3.4.1
  uuid: ^4.5.1
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Polices embarquées : aucun téléchargement de police au runtime
  # (démarrage plus rapide et fiable sur réseaux dégradés).
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/RobotoCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/RobotoCondensed-ExtraBold.ttf
          weight: 800
